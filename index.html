<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Under Maintenance | Samu Sharma</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f5ef; /* warm off-white */
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: #2c2c2c;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .maintenance-box {
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
            text-align: center;
            border-top: 5px solid #d97706; /* subtle saffron accent */
        }

        h1 {
            font-weight: 600;
            margin-bottom: 15px;
        }

        p {
            font-size: 16px;
            color: #555;
        }

        .countdown {
            font-size: 22px;
            font-weight: 500;
            margin-top: 20px;
            color: #1e3a8a; /* subtle indigo tone */
        }

        .btn-custom {
            background-color: #1e3a8a;
            color: #fff;
            border: none;
            margin-top: 25px;
            padding: 10px 25px;
        }

        .btn-custom:hover {
            background-color: #162d6b;
        }

        @media (max-width: 576px) {
            .maintenance-box {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

<div class="maintenance-box">
    <h1>Website Under Maintenance</h1>
    <p>
        I am currently updating my portfolio to make it cleaner and more professional.
        Please check back soon.
    </p>

    <div class="countdown" id="countdown">
        Launching Soon...
    </div>

    <button class="btn btn-custom" onclick="notifyMessage()">
        Notify Me
    </button>
</div>

<!-- Inline JavaScript -->
<script>
    // Simple Countdown (3 Days Demo)
    var countDownDate = new Date();
    countDownDate.setDate(countDownDate.getDate() + 3);

    var x = setInterval(function() {

        var now = new Date().getTime();
        var distance = countDownDate - now;

        var days = Math.floor(distance / (1000 * 60 * 60 * 24));
        var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

        document.getElementById("countdown").innerHTML =
            days + "d " + hours + "h " + minutes + "m ";

        if (distance < 0) {
            clearInterval(x);
            document.getElementById("countdown").innerHTML = "We are Live!";
        }
    }, 1000);

    function notifyMessage() {
        alert("Thank you! The website will be back soon.");
    }
</script>

</body>
</html>
