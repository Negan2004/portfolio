<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Under Maintenance | Samarth Sharma</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f5f1ea;
      font-family: "Georgia", "Times New Roman", serif;
      color: #2c2c2c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .newspaper-wrap {
      max-width: 620px;
      width: 100%;
      text-align: center;
    }

    /* ── Masthead ── */
    .masthead {
      padding: 28px 0 20px;
    }

    .rule {
      border: none;
      border-top: 1px solid #2c2c2c;
      margin: 0;
    }

    .rule-thick {
      border-top-width: 3px;
    }

    .masthead-inner {
      padding: 18px 0 14px;
    }

    .masthead-name {
      font-family: "Georgia", "Times New Roman", serif;
      font-size: clamp(2.2rem, 7vw, 3.4rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      line-height: 1.1;
      color: #1a1a1a;
    }

    .masthead-role {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #555;
      margin-top: 8px;
    }

    /* ── Content ── */
    .content {
      padding: 28px 0 24px;
      border-bottom: 1px solid #2c2c2c;
    }

    .section-label {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 14px;
    }

    .content h2 {
      font-family: "Georgia", "Times New Roman", serif;
      font-size: clamp(1.2rem, 4vw, 1.55rem);
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 14px;
      color: #1a1a1a;
    }

    .content p {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-size: 0.95rem;
      line-height: 1.7;
      color: #444;
    }

    /* ── Button ── */
    .btn-contact {
      display: inline-block;
      margin-top: 26px;
      padding: 10px 28px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #f5f1ea;
      background-color: #2c2c2c;
      border: none;
      cursor: pointer;
    }

    .btn-contact:hover {
      background-color: #1a1a1a;
    }

    /* ── Footer ── */
    footer {
      margin-top: 22px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-size: 0.72rem;
      color: #999;
      letter-spacing: 0.05em;
    }

    @media (max-width: 480px) {
      body {
        padding: 30px 16px;
        justify-content: flex-start;
        padding-top: 50px;
      }

      .btn-contact {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="newspaper-wrap">

    <!-- Masthead -->
    <div class="masthead">
      <hr class="rule rule-thick">
      <div class="masthead-inner">
        <div class="masthead-name">Samarth Sharma</div>
        <div class="masthead-role">Web Developer</div>
      </div>
      <hr class="rule rule-thick">
    </div>

    <!-- Content -->
    <div class="content">
      <p class="section-label">Notice</p>
      <h2>Website Under Maintenance</h2>
      <p>
        This space is currently being updated to better reflect ongoing work and projects.
        It will be available again shortly.
      </p>

      <button class="btn-contact" onclick="showMessage()">
        Contact Me
      </button>
    </div>

    <!-- Footer -->
    <footer>
      &copy; 2026 Samarth Sharma
    </footer>

  </div>

  <script>
    function showMessage() {
      alert("You can reach me at: samugsharma1111@gmail.com");
    }
  </script>

</body>

</html>
